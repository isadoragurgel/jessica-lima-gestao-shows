<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://esm.sh; style-src 'unsafe-inline'; img-src 'self'; connect-src https://hdzpskqbkbfwslwhyldb.supabase.co; base-uri 'none'; form-action 'none'"><title>Recuperar senha | Jessica Lima</title><style>*{box-sizing:border-box}body{margin:0;background:#071729;color:#eef3fa;font:16px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;background:#11253c;border:1px solid #29405c;border-radius:24px;overflow:hidden}.cover{background:#08192b;min-height:560px;position:relative}.cover img{position:absolute;width:100%;height:100%;object-fit:cover}.cover strong{position:absolute;bottom:0;left:0;right:0;padding:50px 24px 24px;background:linear-gradient(transparent,#071729);font-size:28px}.body{padding:36px 28px;align-self:center}h1{font-size:26px;margin:0 0 12px}p{line-height:1.6;color:#bdcbe0}label{display:block;margin:20px 0;font-size:14px}input{display:block;width:100%;margin-top:8px;border:1px solid #4a627f;border-radius:10px;padding:14px;background:#091b2e;color:#fff;font:inherit}button{border:0;background:#dfba80;color:#11243b;border-radius:10px;min-height:48px;padding:12px 18px;font:inherit;font-weight:650;width:100%;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#dfba80}#status{font-size:14px;min-height:24px}small{color:#adc0d8}[hidden]{display:none!important}@media(max-width:650px){body{padding:14px}.card{grid-template-columns:1fr}.cover{min-height:180px;height:180px}.cover img{object-fit:contain;object-position:80% center}.body{padding:26px 22px}.cover strong{font-size:24px}}
</style></head><body><main class="card"><div class="cover"><img src="./guitar-cover.png" alt="Violão acústico sobre fundo navy blue"><strong>Jessica Lima</strong></div><section class="body"><h1 id="title">Recuperar senha</h1><p id="intro">Receba um link para definir uma nova senha do aplicativo.</p><form id="request-form"><label>Email<input type="email" name="email" autocomplete="username" required></label><button type="submit" disabled>Enviar link de recuperação</button></form><form id="password-form" hidden><label>Nova senha<input type="password" name="password" autocomplete="new-password" minlength="8" required></label><label>Repita a nova senha<input type="password" name="confirmation" autocomplete="new-password" minlength="8" required></label><small>Use pelo menos 8 caracteres.</small><button type="submit" style="margin-top:20px" disabled>Salvar nova senha</button></form><p id="status" role="status" aria-live="polite">Conectando…</p><p><a href="./">Voltar para entrar</a></p></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.117.3';
const client=createClient('https://hdzpskqbkbfwslwhyldb.supabase.co','sb_publishable_YKeLOBIvIanAcKulvIP-0Q_QLsAwhL3',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const requestForm=document.getElementById('request-form'),passwordForm=document.getElementById('password-form'),status=document.getElementById('status');let busy=false,session=null;
const callback=new URLSearchParams(location.hash.slice(1));const recoveryHint=callback.get('type')==='recovery'||sessionStorage.getItem('jl-password-recovery')==='1';
function showPassword(){requestForm.hidden=true;passwordForm.hidden=false;document.getElementById('title').textContent='Definir nova senha';document.getElementById('intro').textContent='Esta é a senha para entrar no aplicativo Jessica Lima.';passwordForm.querySelector('button').disabled=false;status.textContent='';sessionStorage.setItem('jl-password-recovery','1')}
client.auth.onAuthStateChange((event,current)=>{session=current;if(event==='PASSWORD_RECOVERY'&&current)showPassword()});
try{const result=await client.auth.getSession();if(result.error)throw result.error;session=result.data.session;requestForm.querySelector('button').disabled=false;if(session&&recoveryHint)showPassword();else{status.textContent=callback.has('error')||recoveryHint?'O link expirou ou não é válido. Solicite um novo abaixo.':'';sessionStorage.removeItem('jl-password-recovery')}}catch{status.textContent='Não foi possível validar o link. Recarregue a página ou solicite um novo.';requestForm.querySelector('button').disabled=false}
requestForm.addEventListener('submit',async event=>{event.preventDefault();if(busy)return;busy=true;const button=requestForm.querySelector('button');button.disabled=true;status.textContent='Enviando…';try{const email=String(new FormData(requestForm).get('email')).trim();const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:new URL('./reset-password.html',location.href).href});if(error)throw error;status.textContent='Se existir uma conta com esse email, enviaremos um link. Confira também o spam. Use o email mais recente.'}catch(error){status.textContent=error.status===429?'Muitas tentativas. Aguarde alguns minutos antes de pedir outro email.':'Não foi possível enviar: '+(error.message||'tente novamente.')}finally{busy=false;button.disabled=false}});
passwordForm.addEventListener('submit',async event=>{event.preventDefault();if(busy)return;const data=new FormData(passwordForm),password=String(data.get('password')||''),confirmation=String(data.get('confirmation')||'');if(password.length<8){status.textContent='Use pelo menos 8 caracteres.';return}if(password!==confirmation){status.textContent='As senhas não coincidem.';return}if(!session){status.textContent='Sua sessão expirou. Solicite um novo link de recuperação.';return}busy=true;const button=passwordForm.querySelector('button');button.disabled=true;status.textContent='Salvando…';try{const {error}=await client.auth.updateUser({password});if(error)throw error;passwordForm.reset();sessionStorage.removeItem('jl-password-recovery');await client.auth.signOut({scope:'local'});passwordForm.hidden=true;status.textContent='Senha alterada. Clique em “Voltar para entrar” e use a nova senha.'}catch(error){status.textContent='Não foi possível alterar: '+(error.message||'solicite um novo link.')}finally{busy=false;button.disabled=false}});
</script></body></html>
