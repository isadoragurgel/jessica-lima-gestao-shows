  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options > button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options > [aria-current="true"],
.viz-carousel-options > button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(> .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker > summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

<script>
(()=>{
const root=document.getElementById('jl-preview'), content=root.querySelector('#jl-content'), nav=root.querySelector('nav');
const money=n=>{const value=Math.round((Number(n)||0)*100)/100;return new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',minimumFractionDigits:Number.isInteger(value)?0:2,maximumFractionDigits:2}).format(value)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='Início',tab='Calendário',dialog=null,invoice=null,calendarMonth='2026-10',selectedDate='2026-10-14',tipsPeriod='Mês',libraryTab='Materiais';
let materials=[],studyTasks=[],trainingSongs=[],purchases=[],libraryCounter=0;
const repertoireNames=['Acoustic Essentials','Pop & Soul'];
function libraryEditor(kind){if(kind==='song')return `<section class="jl-dialog"><div class="jl-row"><h2>Músicas a estudar</h2><button type="button" class="cursor-interaction" data-act="close">Fechar</button></div><form id="jl-library-form" data-kind="song"><label>Músicas<textarea name="names" rows="7" placeholder="Uma música por linha" required></textarea></label><p id="jl-library-error" role="alert"></p><button class="primary cursor-interaction" type="submit">Adicionar</button></form></section>`;const titles={material:'Adicionar material',task:'Nova tarefa de estudo',song:'Músicas a estudar',purchase:'Compra / melhoria'};return `<section class="jl-dialog"><div class="jl-row"><h2>${titles[kind]}</h2><button class="cursor-interaction" data-act="close">Fechar</button></div><form id="jl-library-form" data-kind="${kind}"><div class="jl-fields">${kind==='song'?'<label class="jl-full">Músicas a estudar<textarea name="names" rows="6" placeholder="Escreva uma música por linha" required></textarea></label>':`<label class="jl-full">${kind==='purchase'?'Item':'Título'}<input name="name" required maxlength="160"></label>`}${kind==='material'?'<label class="jl-full">Arquivo ou imagem<input type="file" name="attachment" accept="image/*,.pdf,.doc,.docx,.txt,.mp3,.wav,.m4a,.pptx,.xlsx"></label>':''}${kind==='material'||kind==='song'?'<label class="jl-full">Link (opcional)<input type="url" name="url" placeholder="https://"></label>':''}${kind==='song'?'<label class="jl-full">Artista / versão<input name="artist"></label>':''}${kind==='task'?'<label>Data alvo (opcional)<input type="date" name="due"></label>':''}${kind==='purchase'?'<label>Quantidade<input type="number" name="quantity" min="1" step="1" value="1" required></label><label>Preço unitário estimado (€)<input type="number" name="price" min="0" step="0.01" placeholder="A definir"></label><label>Prioridade<select name="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></label>':''}<label class="jl-full">Notas<textarea name="notes" placeholder="Detalhes, objetivo ou referência"></textarea></label></div><p id="jl-library-error" role="alert"></p>${kind==='material'?'<small>Arquivos são salvos na sua Biblioteca privada.</small>':''}<div class="jl-actions"><button class="primary cursor-interaction" type="submit">Adicionar</button></div></form></section>`}
function safeLink(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function studySongsPanel(){const names=trainingSongs.filter(s=>!s.repertoire).map(s=>s.name).join('\n');return heading('Músicas a estudar','',false)+`<section class="jl-panel"><form id="jl-study-list"><label>Músicas a estudar<textarea name="names" rows="9" placeholder="Escreva uma música por linha…">${esc(names)}</textarea></label><div class="jl-actions"><button type="submit" class="primary cursor-interaction">Salvar</button></div></form></section>`}
function saveStudyList(text){const names=[...new Set(String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean))],active=trainingSongs.filter(s=>!s.repertoire),readySongs=trainingSongs.filter(s=>s.repertoire);trainingSongs=[...readySongs,...names.map(name=>active.find(s=>s.name===name)||{id:++libraryCounter,name,artist:'',url:'',notes:'',repertoire:''})]}
function libraryView(){if(libraryTab==='Estudo')return studySongsPanel()+`<div class="jl-tabs">${['Materiais','Estudo','Repertórios','Melhorias'].map(t=>`<button class="cursor-interaction ${libraryTab===t?'active':''}" data-act="librarytab" data-library="${t}">${t}</button>`).join('')}</div>`;let section='';const actions={Materiais:['material','+ Material'],Estudo:['task','+ Task'],Repertórios:['song','+ Música'],Melhorias:['purchase','+ Item']},[kind,label]=actions[libraryTab];if(libraryTab==='Materiais'){section=`<small>Arquivos, imagens, links e notas · ${materials.length} materiais</small><p class="jl-muted">Arquivos privados, disponíveis depois de entrar na sua conta.</p>${materials.length?materials.map(m=>`<section class="jl-panel" style="margin-top:12px"><h3>${esc(m.name)}</h3>${m.fileName?`<p><small>${esc(m.fileName)} · ${Math.ceil(m.size/1024)} KB</small></p>`:''}${m.image?`<img src="${m.objectUrl}" alt="${esc(m.name)}" style="width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin:10px 0">`:''}<p style="white-space:pre-line">${esc(m.notes)}</p><div class="jl-actions">${m.objectUrl?`<a class="jl-resource-link cursor-interaction" href="${m.objectUrl}" target="_blank" rel="noopener" download="${esc(m.fileName)}">Abrir / baixar arquivo</a>`:''}${m.url?`<a class="jl-resource-link cursor-interaction" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">Abrir link</a>`:''}<button class="cursor-interaction" data-act="remove-material" data-key="${m.id}">Remover</button></div></section>`).join(''):'<div class="jl-goal-hint">Adicione uma partitura, imagem de referência, áudio ou link de estudo.</div>'}`}
if(libraryTab==='Estudo'){section=`<div class="jl-row"><small>${studyTasks.filter(t=>t.done).length} de ${studyTasks.length} tarefas concluídas</small></div>${studyTasks.length?studyTasks.map(t=>`<section class="jl-panel" style="margin-top:12px"><label style="flex-direction:row;align-items:center;font-size:14px;color:var(--jl-text)"><input style="width:auto" type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through':''}">${esc(t.name)}</span></label><p>${esc(t.notes)}</p>${t.due?`<small>Data alvo: ${date(t.due)}</small>`:''}<div class="jl-actions"><button class="cursor-interaction" data-act="remove-task" data-key="${t.id}">Remover</button></div></section>`).join(''):'<div class="jl-goal-hint">Crie tarefas como estudar uma harmonia, memorizar letras ou ensaiar um set.</div>'}`}
if(libraryTab==='Repertórios'){const training=trainingSongs.filter(s=>!s.repertoire);section=`<h2>Músicas a estudar</h2>${training.length?training.map(s=>`<section class="jl-panel" style="margin-top:12px"><h3>${esc(s.name)}</h3><small>${esc(s.artist)}</small><p>${esc(s.notes)}</p>${s.url?`<a class="jl-resource-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Referência</a>`:''}<label style="margin-top:12px">Adicionar ao repertório<select data-song-target="${s.id}">${repertoireNames.map(n=>`<option>${n}</option>`).join('')}</select></label><div class="jl-actions"><button class="primary cursor-interaction" data-act="song-ready" data-key="${s.id}">✓ Pronta para o palco</button><button class="cursor-interaction" data-act="remove-song" data-key="${s.id}">Remover</button></div></section>`).join(''):'<p class="jl-muted">Nenhuma música em treino. Use + Música para começar.</p>'}<h2 style="margin-top:22px">Repertórios dos shows</h2>${repertoireNames.map(n=>`<section class="jl-panel" style="margin-top:12px"><h3>${n}</h3><small>${trainingSongs.filter(s=>s.repertoire===n).length} músicas adicionadas · biblioteca de músicas para os shows</small>${trainingSongs.filter(s=>s.repertoire===n).map(s=>`<div class="jl-row" style="margin-top:12px"><span>${esc(s.name)}<br><small>${esc(s.artist)}</small></span><button class="cursor-interaction" data-act="song-train" data-key="${s.id}">Voltar ao treino</button></div>`).join('')}</section>`).join('')}`}

function tipsPanel(){const all=gigs.filter(tipsEligible),weekly=all.filter(week),monthly=all.filter(g=>g.date.startsWith(earningsMonth)),rankList=tipsPeriod==='Semana'?weekly:tipsPeriod==='Mês'?monthly:all,places=[...new Map(gigs.map(g=>[String(g.place||'').trim().toLocaleLowerCase(),String(g.place||'').trim()])).entries()].filter(([key,place])=>key&&place),rank=places.map(([placeKey,place])=>{const list=rankList.filter(g=>String(g.place||'').trim().toLocaleLowerCase()===placeKey);return {place,total:tipsSum(list),count:list.length,mean:list.length?tipsSum(list)/list.length:0}}).sort((a,b)=>b.total-a.total),max=Math.max(1,...rank.map(r=>r.total)),leader=rank[0],ties=rank.filter(r=>r.total===leader?.total&&r.count>0);return `<section class="jl-panel" style="margin-bottom:18px"><div class="jl-row"><h2>Tips recebidas</h2><button class="primary cursor-interaction" data-act="tipsselect">+ Registrar</button></div><label>Mês de referência<input name="earningsMonth" type="month" value="${earningsMonth}"></label><div class="jl-tips-totals"><div><small>Semana ${date(currentWeek().start)} – ${date(currentWeek().end)}</small><strong>${money(tipsSum(weekly))}</strong></div><div><small>${monthName(earningsMonth)}</small><strong>${money(tipsSum(monthly))}</strong></div><div><small>Total do histórico</small><strong>${money(tipsSum(all))}</strong></div></div><small>Depois de concluir o show na Agenda, use Registrar tips. Em duo, registre sua parte. Inclui registros de €0.</small><div class="jl-tabs" style="margin-top:18px">${['Semana','Mês','Total'].map(p=>`<button class="cursor-interaction ${p===tipsPeriod?'active':''}" data-act="tipsperiod" data-period="${p}" aria-pressed="${p===tipsPeriod}">${p}</button>`).join('')}</div><h3>Por forma de recebimento · ${esc(tipsPeriod)}</h3>${[['cash','Cash'],['revolut','Revolut'],['coffee','Buy Me a Coffee']].map(([key,label])=>`<div class="jl-row" style="margin:10px 0"><span>${label}</span><strong>${money(rankList.reduce((s,g)=>s+Number(g.tipsBreakdown?.[key]||0),0))}</strong></div>`).join('')}${rankList.some(g=>!g.tipsBreakdown&&g.tips>0)?`<small>Sem forma informada: ${money(rankList.filter(g=>!g.tipsBreakdown).reduce((s,g)=>s+g.tips,0))}</small>`:''}<h3 style="margin-top:18px">Qual o melhor pub para tips?</h3>${rank.map(r=>`<div class="jl-month-row"><div class="jl-row"><strong>${pubTag(r.place)}</strong><strong>${money(r.total)}</strong></div><div class="jl-month-track" role="img" aria-label="${esc(r.place)}: ${money(r.total)} de tips"><span style="width:${r.total/max*100}%"></span></div><small>${r.count} shows com tips registradas · ${r.count?money(r.mean):'—'} por show</small></div>`).join('')}<div class="jl-goal-hint">${!rankList.length?'Ainda não há tips registradas neste período.':leader.total===0?'Todos os valores registrados neste período são €0.':ties.length>1?'Empate no total de tips entre os locais.':`<strong>${esc(leader.place)}</strong> lidera no total de tips (${money(leader.total)}).`}<br><small>Compare também a média por show: locais com mais apresentações podem ter um total maior.</small></div><h3 style="margin-top:18px">Shows realizados sem tips registradas</h3>${gigs.filter(g=>g.status==='Realizada'&&!g.tipsRecorded).map(g=>`<div class="jl-row" style="margin-top:10px"><small>${date(g.date)} · ${esc(g.place)}</small><button class="cursor-interaction" data-act="tips" data-id="${g.id}" data-gig-uuid="${esc(g.dbId||'')}">Registrar tips</button></div>`).join('')||'<p class="jl-muted">Nenhum registro pendente.</p>'}<h3 style="margin-top:18px">Registros por show · ${esc(tipsPeriod)}</h3>${rankList.length?rankList.sort((a,b)=>b.date.localeCompare(a.date)).map(g=>`<div class="jl-gig"><div class="jl-date">${g.date.slice(8)}<small>${(['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'][Number(g.date.slice(5,7))-1]||'')}</small></div><div><h3>${pubTag(g.place,g.color)}</h3><small>${date(g.date)} · ${g.format} · ${money(g.tips)}</small><p><small>${g.tipsBreakdown?Object.entries(g.tipsBreakdown).filter(([key,value])=>value>0).map(([key,value])=>({cash:'Cash',revolut:'Revolut',coffee:'Buy Me a Coffee'}[key])+' '+money(value)).join(' · '):'Forma de recebimento não informada'}</small></p><div class="jl-actions"><button class="cursor-interaction" data-act="tips" data-id="${g.id}" data-gig-uuid="${esc(g.dbId||'')}">Editar tips</button></div></div></div>`).join(''):'<p class="jl-muted">Nenhum registro ainda.</p>'}</section>`}
function tipsForm(g){const breakdown=g.tipsBreakdown||{},unclassified=g.tipsRecorded&&!g.tipsBreakdown&&g.tips>0;return `<section class="jl-dialog"><div class="jl-row"><h2>Registrar tips recebidas</h2><button class="cursor-interaction" data-act="close">Fechar</button></div><p>${esc(g.place)} · ${date(g.date)} · ${g.format}</p><form id="jl-tips-form" data-id="${g.id}" data-gig-uuid="${esc(g.dbId||'')}"><div class="jl-fields">${[['cash','Cash'],['revolut','Revolut'],['coffee','Buy Me a Coffee']].map(([key,label])=>`<label>${label} (€)<input name="tips_${key}" type="number" min="0" step="0.01" value="${breakdown[key]??''}" placeholder="0,00"></label>`).join('')}</div>${unclassified?`<p class="jl-note">Há ${money(g.tips)} registrados sem forma de recebimento. Distribua esse valor nas opções acima.</p>`:''}<div class="jl-row"><strong>Total das tips</strong><div class="jl-value" id="jl-tips-live" aria-live="polite">${money(g.tipsRecorded?g.tips:0)}</div></div><small>Em duo, informe somente a parte da Jessica. Pode usar mais de uma forma de recebimento. Salvar substitui o registro anterior.</small><p id="jl-tips-error" role="alert"></p><div class="jl-actions"><button class="primary cursor-interaction" type="submit">Salvar tips recebidas</button></div></form></section>`}

function monthGigCounts(month=earningsMonth){const list=gigs.filter(g=>g.date.startsWith(month)&&g.status!=='Cancelada');return {total:list.length,completed:list.filter(g=>g.status==='Realizada').length,confirmed:list.filter(g=>g.status==='Confirmada').length,negotiating:list.filter(g=>g.status==='Em negociação').length}}
function monthGigCounter(){const oldMonth=earningsMonth;earningsMonth=cloudToday().slice(0,7);const counts=monthGigCounts();earningsMonth=oldMonth;return `<section class="jl-panel jl-gig-counter"><div class="jl-row"><div><small>${esc(monthName(cloudToday().slice(0,7)))}</small><h2>Gigs no mês</h2></div><strong class="jl-value">${counts.total}</strong></div><div class="jl-counter-details"><span class="jl-tag jl-status-done">${counts.completed} realizadas</span><span class="jl-tag">${counts.confirmed} confirmadas</span><span class="jl-tag">${counts.negotiating} em negociação</span></div><small>Gigs canceladas não entram no contador.</small></section>`}
async function shareInvoicePDF(doc){try{const file=new File([buildPdfBytes(doc)],'Jessica-Lima-Invoice-'+String(doc.number).replace(/[^a-zA-Z0-9-]/g,'-')+'.pdf',{type:'application/pdf'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Invoice '+doc.number});return}downloadInvoice(doc)}catch(error){if(error.name!=='AbortError'){message('Não foi possível compartilhar. Use Baixar PDF.')}}}
function invoiceCopyText(i){const doc=invoiceRecordDoc(i),a=invoiceAgencyRecord(i),url=invoiceEmailURL(i);if(!url)return '';const parameters=new URLSearchParams(url.split('?')[1]);return 'To: '+(a?.email||doc.email)+'\nSubject: '+parameters.get('subject')+'\n\n'+parameters.get('body')}
async function copyInvoiceEmail(i){const text=invoiceCopyText(i);try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(text);message('Email copiado. Cole no seu email e anexe o PDF baixado.')}catch{message('Copie o destinatário e a mensagem exibidos na tela.')}}
function todayAgenda(){const today=cloudToday(),list=gigs.filter(g=>g.date===today&&g.status!=='Cancelada').sort((a,b)=>a.time.localeCompare(b.time)),upcoming=gigs.filter(g=>g.date>today&&g.status!=='Cancelada').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0],label=new Intl.DateTimeFormat('pt-BR',{timeZone:'Europe/Dublin',weekday:'long',day:'numeric',month:'long'}).format(new Date(today+'T12:00:00Z'));return `<section class="jl-panel jl-today"><div class="jl-row"><div><div class="jl-eyebrow">${esc(label)}</div><h1>Gigs do dia</h1></div><button class="primary cursor-interaction" data-act="new">+ Nova gig</button></div><p class="jl-muted">${list.length?list.length+(list.length===1?' apresentação':' apresentações')+' para acompanhar hoje.':'Hoje está livre.'}</p>${list.length?cards(list):`<div class="jl-today-empty"><strong>Nenhuma gig marcada para hoje.</strong><p>${upcoming?'Próxima apresentação: '+esc(upcoming.place)+' · '+date(upcoming.date)+' · '+esc(upcoming.time):'Adicione uma apresentação para organizar sua agenda.'}</p></div>`}<div class="jl-actions"><button class="cursor-interaction" data-page="Agenda">Ver calendário completo</button></div></section>`}
function recentGigHistory(){const today=cloudToday(),recent=gigs.filter(g=>g.date<today).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,5);return `<details class="jl-panel" style="margin-bottom:18px"><summary>Últimas gigs</summary>${cards(recent)}</details>`}

function jlHistoryPanel(){
const normalize=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const existing=new Set(gigs.map(g=>String(g.date)+'|'+normalize(g.place)));
const duplicated=JL_HISTORICO_REVISAR.filter(g=>existing.has(g.date+'|'+normalize(g.venue))).length;
const rows=JL_HISTORICO_REVISAR.map(g=>`<tr><td>${esc(g.date)}</td><td>${esc(g.venue)}</td><td>${esc(g.start_time)}</td><td>${esc(g.formation==='duo'?'Duo com Chris':g.formation==='adm'?'ADM':'Solo')}</td><td>${existing.has(g.date+'|'+normalize(g.venue))?'Possível duplicação':g.review_required?'Revisar':'Pendente'}</td></tr>`).join('');
return `<details class="jl-history-review"><summary>Histórico dos prints · ${JL_HISTORICO_REVISAR.length} registros para revisão</summary><p><strong>${duplicated} possíveis duplicações</strong> com gigs já carregadas (comparação por data e venue). Os valores não foram inventados e <strong>nada será importado automaticamente</strong>.</p><div class="jl-history-actions"><button type="button" class="primary" data-act="history-import-confirm">Adicionar ao calendário os registros que ainda não existem</button><small>Confirme antes de gravar. Horários não informados permanecerão em branco; nenhum cachê será inventado.</small></div><div class="jl-history-scroll"><table><thead><tr><th>Data</th><th>Venue</th><th>Hora</th><th>Formação</th><th>Situação</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}

function jlImportHistoricalGigs(){
 const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const existing=new Set(gigs.map(g=>g.date+'|'+norm(g.place)));
 let added=0,skipped=0;
 for(const h of JL_HISTORICO_REVISAR){
  const key=h.date+'|'+norm(h.venue);
  if(existing.has(key)){skipped++;continue;}
  const formation=h.formation==='duo'?'Duo':'Solo';
  const t=h.start_time||'';
  const minutes=Number(h.duration_minutes)||120;
  let end='';if(/^\d{2}:\d{2}$/.test(t)){const [hh,mm]=t.split(':').map(Number);end=String((hh+Math.floor((mm+minutes)/60))%24).padStart(2,'0')+':'+String((mm+minutes)%60).padStart(2,'0')}
  gigs.push({id:Math.max(0,...gigs.map(g=>Number(g.id)||0))+1,date:h.date,day:'',time:t,endTime:end,duration:minutes/60,place:h.venue,client:h.venue,format:formation,partnerName:formation==='Duo'?'Chris':'',partner:null,fee:null,cost:0,tips:0,status:'Confirmada',paid:0,agencyId:'',payer:'direct',paymentCycle:'a_definir',notes:[h.notes||'',h.formation==='adm'?'Fade Street ADM — confirmar classificação':'',!t?'Horário a confirmar':'','Importado da agenda histórica dos prints'].filter(Boolean).join(' · '),source:'agenda-print'});
  existing.add(key);added++;
 }
 return {added,skipped};
}

<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0

      openTooltip(trigger);

      openTimeout = null;
      pendingTrigger = null;

  };

    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();

<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
