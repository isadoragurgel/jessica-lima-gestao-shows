<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nova despesa</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#202127;background:#fff;font-size:16px}*{box-sizing:border-box}body{margin:0;padding:26px 28px 32px;background:white}main{max-width:900px;margin:auto}h1{font-size:25px;margin:0 0 24px;font-weight:700;letter-spacing:-.5px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e6b6a2;outline-offset:2px}.amount{text-align:center;margin:12px auto 35px}.amount label{display:block;color:#68666a;font-size:14px;margin-bottom:8px}.amount-entry{display:flex;justify-content:center;align-items:center;gap:10px}.currency{font-size:27px;font-weight:700}.amount input{width:174px;height:54px;border:1px solid #d9d6d4;border-radius:28px;text-align:center;font-size:25px;color:#19191b;background:white}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.field-title{font-size:16px;font-weight:600;color:#343339}.add{border:1px solid #dfc2b5;color:#a84f35;background:#fff;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600}.categories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.category{min-width:0;min-height:84px;background:#f5f4f4;border:1px solid #e6e4e3;border-radius:17px;color:#343337;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 6px;font-size:13px}.category svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.category.selected{border:2px solid #b15b43;background:#faeee8;color:#963e28;font-weight:700}.field{display:block;margin-top:24px}.field .field-title{display:block;margin-bottom:10px}.field input,.more input,.more textarea,.extra select{width:100%;height:49px;border:1px solid #dad6d3;border-radius:22px;padding:10px 16px;background:white;color:#252329}.field input::placeholder{color:#999}.accounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;background:#f4f3f3;border-radius:25px;gap:3px}.account{border:0;background:transparent;color:#777276;padding:12px 6px;border-radius:22px;min-width:0;font-size:14px}.account.selected{background:white;color:#242125;box-shadow:0 1px 6px #00000018;font-weight:600}.split{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:26px 0 14px}.split strong{display:block;font-size:16px}.split small{display:block;color:#777;margin-top:4px}.switch{appearance:none;width:44px;height:26px;flex-shrink:0;border-radius:20px;border:1px solid #d0cece;background:#e9e9e9;position:relative;cursor:pointer}.switch:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:white;border-radius:50%;box-shadow:0 1px 3px #0002;transition:left .15s}.switch:checked{background:#ae6046;border-color:#ae6046}.switch:checked:before{left:21px}.extra{margin:22px 0 24px}.extra summary{cursor:pointer;color:#69666a;font-size:14px;list-style:none}.extra summary:before{content:'⌄';margin-right:9px;color:#222}.more{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.more label,.extra label{font-size:13px;color:#575257}.more input,.more textarea,.extra select{display:block;margin-top:6px;border-radius:12px}.more textarea{height:75px;resize:vertical}.save{width:100%;height:54px;border:0;border-radius:28px;background:#ac6048;color:white;font-size:16px;font-weight:700}.save:hover{background:#974b35}.error{color:#b42318;font-size:13px;margin:9px 0}.split-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.split-fields label{font-size:13px}.split-fields input,.split-fields select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:5px}.extra-type{margin-bottom:20px}.extra-type summary{color:#777;font-size:13px;cursor:pointer}.extra-type select{margin-top:8px}.new-cat{display:flex;gap:8px;margin-top:12px}.new-cat input{flex:1;min-width:0;border:1px solid #ddd;border-radius:12px;padding:10px}.new-cat button{border:0;border-radius:12px;background:#ad6048;color:white;padding:10px}.hidden,[hidden]{display:none!important}@media(max-width:560px){body{padding:18px 14px 26px}h1{font-size:22px}.categories{gap:7px}.category{min-height:76px;padding:8px 3px;font-size:11px}.category svg{width:21px;height:21px}.add{font-size:12px;padding:8px}.more,.split-fields{grid-template-columns:1fr}.amount{margin-bottom:27px}}
</style></head><body><main><h1>Nova despesa</h1><form id="expense"><div class="amount"><label for="amount">Valor da despesa</label><div class="amount-entry"><span class="currency">€</span><input id="amount" name="amount" inputmode="decimal" type="text" placeholder="0,00" required autocomplete="off"></div></div><div class="heading"><span class="field-title">Categoria</span><button type="button" class="add" id="add-category">+ Criar categoria</button></div><div class="categories" id="categories"></div><div class="new-cat hidden" id="new-cat"><input id="cat-name" placeholder="Nome da categoria" maxlength="60"><button type="button" id="confirm-cat">Adicionar</button></div><label class="field"><span class="field-title">Descrição</span><input name="description" placeholder="Ex.: supermercado, gasolina..." required></label><div class="field"><span class="field-title">Pago com</span><div class="accounts" id="accounts"></div></div><div class="split" id="split"><div><strong>Dividir com Isadora</strong><small>Metade para cada uma</small></div><input class="switch" type="checkbox" id="split-check" aria-label="Dividir com Isadora"></div><div class="split-fields hidden" id="split-fields"><label>Quem pagou?<select id="payer"><option value="Jessica">Jéssica</option><option value="Isadora">Isadora</option></select></label><label>Minha parte (%)<input id="percent" type="number" min="0" max="100" value="50"></label></div><details class="extra"><summary>Mais opções: data e notas</summary><div class="more"><label>Data<input type="date" id="date" required></label><label>Notas (opcional)<textarea id="note" placeholder="Observações..."></textarea></label></div></details><details class="extra-type"><summary>Outro tipo de lançamento</summary><label>Tipo de lançamento<select id="type"><option value="expense">Despesa</option><option value="income">Receita manual</option><option value="brazil-expense">Brasil — despesa</option><option value="investment">Brasil — investimento</option><option value="transfer">Transferência entre contas</option><option value="reimbursement">Reembolso recebido</option></select></label><label id="destination-wrap" class="hidden">Conta de destino<select id="destination"></select></label></details><div class="error" id="error" role="alert"></div><button type="submit" class="save">✓ Salvar despesa</button></form></main><script>
const icons={"Alimentação":'<path d="m3 10 2 10h14l2-10H3Z"/><path d="m8 10 4-7 4 7M2 10h20M9 14v3m6-3v3"/>',"Transporte":'<path d="M5 17V9l2-5h10l2 5v8H5ZM5 9h14M7 14h2m6 0h2"/>',"Casa":'<path d="m3 10 9-7 9 7v11H3V10Zm6 11v-7h6v7"/>',"Lazer":'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',"Músicos":'<path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',"Outros":'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};const defaults=Object.keys(icons);let categories=[...defaults],accounts=['Conta bancária','Dinheiro','Banco digital'],selected='Alimentação',account=accounts[0];const $=id=>document.getElementById(id);const send=(kind,extra={})=>parent.postMessage({kind,...extra},location.origin);function svg(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[k]||'<path d="M20 13 13 20 3 10V3h7l10 10Z"/>')+'</svg>'}function renderCategories(){const root=$('categories');root.replaceChildren();for(const c of categories){const b=document.createElement('button');b.type='button';b.className='category'+(selected===c?' selected':'');b.setAttribute('aria-pressed',String(selected===c));b.innerHTML=svg(c);const t=document.createElement('span');t.textContent=c;b.append(t);b.onclick=()=>{selected=c;renderCategories()};root.append(b)}resize()}function renderAccounts(){const root=$('accounts');root.replaceChildren();for(const a of accounts){const b=document.createElement('button');b.type='button';b.className='account'+(account===a?' selected':'');b.textContent=a==='Conta bancária'?'Banco':a==='Banco digital'?'Digital':a;b.onclick=()=>{account=a;renderAccounts()};root.append(b)}$('destination').replaceChildren(...accounts.map(a=>{const o=document.createElement('option');o.value=o.textContent=a;return o}));resize()}function resize(){send('mc-height',{height:document.documentElement.scrollHeight+25})}window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.kind==='mc-init'){accounts=d.accounts||accounts;categories=[...defaults,...(d.categories||[])];$('date').value=d.today||new Date().toISOString().slice(0,10);account=accounts[0];renderCategories();renderAccounts()}if(d.kind==='mc-categories'){categories=[...defaults,...(d.categories||[])];renderCategories()}if(d.kind==='mc-error'){$('error').textContent=d.message}});$('add-category').onclick=()=>{$('new-cat').classList.toggle('hidden');$('cat-name').focus();resize()};$('confirm-cat').onclick=()=>{const name=$('cat-name').value.trim();if(!name)return;if(!categories.some(x=>x.toLowerCase()===name.toLowerCase())){categories.push(name);send('mc-category',{name})}selected=name;renderCategories();$('new-cat').classList.add('hidden');$('cat-name').value='';resize()};$('split-check').onchange=()=>{$('split-fields').classList.toggle('hidden',!$('split-check').checked);resize()};$('type').onchange=()=>{const transfer=$('type').value==='transfer';$('destination-wrap').classList.toggle('hidden',!transfer);$('split').classList.toggle('hidden',transfer||$('type').value!=='expense');$('split-fields').classList.toggle('hidden',transfer||!$('split-check').checked);document.querySelector('.save').textContent='✓ Salvar '+($('type').value==='expense'?'despesa':'lançamento');resize()};$('expense').onsubmit=e=>{e.preventDefault();$('error').textContent='';send('mc-save',{value:{amount:$('amount').value,description:document.querySelector('[name=description]').value,category:selected,account,date:$('date').value,note:$('note').value,type:$('type').value,split:$('split-check').checked,payer:$('payer').value,jessica:Number($('percent').value),destination:$('destination').value}})};new ResizeObserver(resize).observe(document.body);send('mc-ready');
</script></body></html>
